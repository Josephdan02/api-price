server {
    # Puerto sustituido por docker/start.sh según $PORT de la plataforma
    # (fallback local: 8080). Nginx no soporta variables de entorno aquí.
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    # Logs al stdout/stderr del contenedor (visibles en `docker logs` y en el
    # stream de logs de la plataforma). Nginx escribe estos archivos como
    # master antes de pasar a workers, mismo patrón que la imagen oficial.
    access_log /dev/stdout;
    error_log /dev/stderr;

    # El default de nginx es 1M y produce 413 silenciosos en payloads de la API.
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}